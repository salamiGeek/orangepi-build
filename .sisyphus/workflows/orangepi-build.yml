# Orange Pi Build CI Workflow
# 自动构建 Orange Pi 固件镜像，并上传构建产物
name: Orange Pi Build CI

# 触发条件：支持自动触发（push）和手动触发（workflow_dispatch）
on:
  push:
    branches:
      - next  # 只监听 next 分支
  workflow_dispatch:
    # 支持手动触发，可以自定义板型
    inputs:
      board:
        description: 'Orange Pi 板型'
        required: false
        default: 'orangepi4pro'
        type: string

jobs:
  build:
    name: 构建 Orange Pi 镜像
    runs-on: ubuntu-22.04  # 使用 Ubuntu 22.04 runner（稳定的构建环境）
    timeout-minutes: 360  # 6 小时超时（完整构建需要 2-4 小时）

    steps:
      # ========================================
      # 阶段 1: 代码检出与环境准备
      # ========================================

      # 检出代码仓库
      - name: 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史记录，便于版本标记

      # 释放磁盘空间（关键步骤！）
      # 说明：GitHub Actions runner 默认只有约 14GB 可用空间
      # Orange Pi 完整构建需要 10-15GB 磁盘空间
      # 此步骤可以释放 20-30GB 空间，避免构建中途磁盘空间不足
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          # 以下选项会删除大型预装软件包
          android: true      # 删除 Android SDK（约 14GB）
          dotnet: true       # 删除 .NET runtime（约 2.7GB）
          haskell: true      # 删除 Haskell 工具链
          large-packages: true  # 删除其他大型软件包（约 5.3GB）
          docker-images: true   # 删除 Docker 镜像和缓存（约 3.2GB）
          swap-storage: true    # 删除交换文件（约 4GB）
          tool-cache: false     # 保留 Python/Node.js 等构建工具

      # 显示释放空间后的磁盘情况
      - name: 检查磁盘空间
        run: |
          echo "=== 释放空间后的磁盘情况 ==="
          df -h /

      # ========================================
      # 阶段 2: 构建缓存（加速重复构建）
      # ========================================

      # 缓存交叉编译工具链和预编译包
      # 说明：此缓存可以节省 5-15 分钟的构建时间
      # 工具链和预编译包不会经常变化，可以长时间缓存
      - name: 缓存交叉编译工具链
        uses: actions/cache@v4
        with:
          path: |
            toolchains/           # 交叉编译工具链
            external/cache/debs/  # 预编译的 Debian 包
          key: ${{ runner.os }}-toolchain-orangepi4pro-${{ hashFiles('external/config/boards/orangepi4pro.conf') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-orangepi4pro-
            ${{ runner.os }}-toolchain-

      # 配置 ccache（编译缓存）
      # 说明：ccache 可以缓存编译结果，大幅加速增量构建
      # 对于重复构建，可以节省 50-90% 的编译时间
      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ runner.os }}-ccache-orangepi4pro-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-orangepi4pro-
            ${{ runner.os }}-ccache-
          max-size: 5G  # 最大缓存大小 5GB

      # ========================================
      # 阶段 3: 依赖安装与构建
      # ========================================

      # 安装基础编译依赖
      # 说明：使用 DEBIAN_FRONTEND=noninteractive 避免 apt 交互提示
      # 某些包（如 tzdata）在没有 TTY 的 CI 环境中会挂起等待用户输入
      - name: 安装基础依赖
        run: |
          echo "=== 安装基础编译依赖 ==="
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            build-essential git wget curl ca-certificates \
            qemu-user-static ccache rsync jq pigz pixz

      # 编译 Orange Pi 镜像
      # 说明：
      # - 必须使用 sudo 运行 build.sh（需要 root 权限创建镜像、挂载文件系统等）
      # - BOARD: 目标板型（默认 orangepi4pro）
      # - BRANCH: 内核分支（current=稳定版）
      # - RELEASE: 发行版（jammy=Ubuntu 22.04）
      # - BUILD_OPT: 构建类型（image=完整镜像）
      # - BUILD_DESKTOP/BUILD_MINIMAL: 是否构建桌面/最小化版本
      # - KERNEL_CONFIGURE: 是否交互式配置内核（no=使用默认配置）
      - name: 编译 Orange Pi 镜像
        env:
          BOARD: ${{ github.event.inputs.board || 'orangepi4pro' }}
        run: |
          echo "========================================"
          echo "开始编译 Orange Pi ${BOARD}"
          echo "========================================"
          echo ""
          echo "构建参数："
          echo "  BOARD: ${BOARD}"
          echo "  BRANCH: current"
          echo "  RELEASE: jammy (Ubuntu 22.04)"
          echo "  BUILD_OPT: image"
          echo "  BUILD_DESKTOP: no"
          echo "  BUILD_MINIMAL: no"
          echo "  KERNEL_CONFIGURE: no"
          echo ""

          # 设置 ccache 环境变量（加速编译）
          export CCACHE_DIR=$HOME/.ccache
          export PATH="/usr/lib/ccache:$PATH"

          # 显示初始磁盘空间
          echo "=== 构建前磁盘使用情况 ==="
          df -h /

          # 执行构建（使用 sudo）
          # build.sh 会自动安装所有必要的依赖
          sudo ./build.sh \
            BOARD=${BOARD} \
            BRANCH=current \
            RELEASE=jammy \
            BUILD_OPT=image \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no

          # 显示构建后磁盘空间
          echo ""
          echo "========================================"
          echo "构建完成！磁盘使用情况："
          echo "========================================"
          df -h /
          df -h ./output/images

      # ========================================
      # 阶段 4: 构建产物处理
      # ========================================

      # 准备源码压缩包（包含完整源码缓存）
      # 说明：
      # - 此压缩包包含完整的构建系统 + 源码缓存 + 预编译包
      # - 下载后可以在本地完全离线编译，无需重新下载源码
      # - 源码缓存 external/cache/sources/ 约 5-10GB
      # - 压缩后预计 2-4GB（压缩率 60-70%）
      - name: 准备源码压缩包
        run: |
          echo "========================================"
          echo "准备源码压缩包"
          echo "========================================"
          echo ""
          echo "包含内容："
          echo "  - 配置文件: external/config/"
          echo "  - 构建脚本: scripts/"
          echo "  - 源码缓存: external/cache/sources/（约 5-10GB）"
          echo "  - 预编译包: external/cache/debs/（约 100MB）"
          echo "  - 主构建脚本: build.sh"
          echo "  - 文档文件: LICENSE, README.md"
          echo ""
          echo "说明：此源码包支持完全离线编译"

          # 创建 artifacts 目录
          mkdir -p ./artifacts
          echo ""
          echo ""

          # 创建源码压缩包（xz 高压缩比）
          tar -I 'xz -9' -cf ./artifacts/orangepi4pro-sources.tar.xz \
            --exclude='.git' \
            --exclude='output/images' \
            --exclude='output/debug' \
            --exclude='output/.tmp' \
            --exclude='external/cache/.aria2' \
            --exclude='external/cache/rootfs' \
            external/config/ \
            external/cache/sources/ \
            external/cache/debs/ \
            scripts/ \
            build.sh \
            LICENSE \
            README.md

          echo ""
          echo "=== 源码包创建完成 ==="
          du -h ./artifacts/orangepi4pro-sources.tar.xz

      # 上传 Orange Pi 镜像
      # 说明：
      # - 镜像文件通常已经压缩（.img.gz, .img.xz）
      # - 设置 compression-level: 0 跳过再次压缩，节省时间
      # - 保留 30 天，便于回溯和测试
      - name: 上传 Orange Pi 镜像
        uses: actions/upload-artifact@v4
        with:
          name: orangepi4pro-image-${{ github.sha }}
          path: |
            output/images/*.img*
            output/images/*.sha
          retention-days: 30
          compression-level: 0  # 文件已压缩，跳过再次压缩
          if-no-files-found: warn

      # 上传源码压缩包
      # 说明：此压缩包包含完整源码缓存，用于本地离线编译
      - name: 上传源码压缩包
        uses: actions/upload-artifact@v4
        with:
          name: orangepi4pro-sources-${{ github.sha }}
          path: ./artifacts/orangepi4pro-sources.tar.xz
          retention-days: 30
          compression-level: 0  # xz 已压缩，跳过再次压缩
          if-no-files-found: error

      # 上传构建日志（便于调试）
      # 说明：
      # - 即使构建失败也上传日志（if: always()）
      # - 日志包含构建过程的详细信息，便于问题排查
      # - 保留 7 天（较短的保留时间）
      - name: 上传构建日志
        if: always()  # 即使构建失败也上传日志
        uses: actions/upload-artifact@v4
        with:
          name: orangepi4pro-logs-${{ github.sha }}
          path: |
            output/debug/
            *.log
          retention-days: 7
          if-no-files-found: ignore

      # ========================================
      # 阶段 5: 构建摘要
      # ========================================

      # 生成构建摘要
      # 说明：构建摘要会显示在 GitHub Actions 页面顶部
      # 包含构建配置、产物列表、磁盘使用情况等关键信息
      - name: 生成构建摘要
        if: always()  # 无论成功或失败都生成摘要
        run: |
          # 构建头部信息
          echo "# Orange Pi 构建摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 构建配置" >> $GITHUB_STEP_SUMMARY
          echo "| 参数 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 板型 | ${{ github.event.inputs.board || 'orangepi4pro' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 发行版 | Ubuntu Jammy (22.04) |" >> $GITHUB_STEP_SUMMARY
          echo "| 内核分支 | current |" >> $GITHUB_STEP_SUMMARY
          echo "| 构建类型 | 镜像 (无桌面) |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发方式 | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 构建产物列表
          if [ -d "output/images" ] && [ -n "$(ls -A output/images)" ]; then
            echo "## 构建产物" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh output/images/ >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 构建产物" >> $GITHUB_STEP_SUMMARY
            echo "❌ 未找到构建产物" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # 源码包信息
          if [ -f "./artifacts/orangepi4pro-sources.tar.xz" ]; then
            echo "## 源码包" >> $GITHUB_STEP_SUMMARY
            echo "- **文件名**: \`orangepi4pro-sources.tar.xz\`" >> $GITHUB_STEP_SUMMARY
            echo "- **大小**: \`\`\`text" >> $GITHUB_STEP_SUMMARY
            du -h ./artifacts/orangepi4pro-sources.tar.xz >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "- **包含**: 完整源码缓存（支持离线编译）" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # 磁盘使用情况
          echo "## 磁盘使用" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          df -h / >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 构建状态
          if [ -d "output/images" ] && [ -n "$(ls -A output/images)" ]; then
            echo "## 构建状态" >> $GITHUB_STEP_SUMMARY
            echo "✅ 构建成功！" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 构建状态" >> $GITHUB_STEP_SUMMARY
            echo "❌ 构建失败或未完成" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # 下载提示
          echo "## 下载产物" >> $GITHUB_STEP_SUMMARY
          echo "构建产物已作为 GitHub Actions artifacts 上传，" >> $GITHUB_STEP_SUMMARY
          echo "可以在本页面底部的 'Artifacts' 部分下载。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 如何使用源码包" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# 1. 下载并解压源码包" >> $GITHUB_STEP_SUMMARY
          echo "tar -xf orangepi4pro-sources.tar.xz" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 2. 进入构建目录" >> $GITHUB_STEP_SUMMARY
          echo "cd external/orangepi-build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 3. 执行编译（无需网络，完全离线）" >> $GITHUB_STEP_SUMMARY
          echo "sudo ./build.sh BOARD=orangepi4pro BRANCH=current RELEASE=jammy \\" >> $GITHUB_STEP_SUMMARY
          echo "  BUILD_OPT=image BUILD_DESKTOP=no BUILD_MINIMAL=no KERNEL_CONFIGURE=no" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # ========================================
      # 结束标记
      # ========================================

      # 构建成功标记
      - name: 构建完成
        if: success()
        run: |
          echo "========================================"
          echo "✅ Orange Pi 构建成功完成！"
          echo "========================================"
          echo ""
          echo "构建产物："
          echo "  - 镜像文件: orangepi4pro-image-${{ github.sha }}"
          echo "  - 源码包: orangepi4pro-sources-${{ github.sha }}"
          echo "  - 构建日志: orangepi4pro-logs-${{ github.sha }}"
          echo ""
          echo "请在 Actions 页面底部的 Artifacts 部分下载产物。"

      # 构建失败标记
      - name: 构建失败
        if: failure()
        run: |
          echo "========================================"
          echo "❌ Orange Pi 构建失败！"
          echo "========================================"
          echo ""
          echo "请检查构建日志获取详细错误信息。"
          echo "构建日志已作为 artifact 上传，可以在 Artifacts 部分下载。"
          exit 1
